name: Release AirRetro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset: AirRetro-linux-x86_64
          - name: Windows
            os: windows-latest
            asset: AirRetro-windows-x86_64.exe

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run application tests
        run: python -m unittest -v test_server.py

      - name: Build Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name AirRetro \
            --add-data "index.html:." \
            --add-data "assets:assets" \
            server.py
          mv dist/AirRetro dist/${{ matrix.asset }}

      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name AirRetro `
            --add-data "index.html;." `
            --add-data "assets;assets" `
            server.py
          Move-Item dist/AirRetro.exe dist/${{ matrix.asset }}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          path: release

      - name: Create checksums
        shell: bash
        run: |
          find release -mindepth 2 -maxdepth 2 -type f -exec cp {} release/ \;
          sha256sum release/AirRetro-* > release/SHA256SUMS.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/AirRetro-* release/SHA256SUMS.txt \
            --title "AirRetro ${{ github.ref_name }}" \
            --generate-notes
