name: Release AirRetro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux application
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run application tests
        run: python -m unittest -v test_server.py

      - name: Build Linux application
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name AirRetro \
            --add-data "index.html:." \
            --add-data "assets:assets" \
            server.py
          mv dist/AirRetro dist/AirRetro-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: AirRetro-linux-x86_64
          path: dist/AirRetro-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run application tests
        run: python -m unittest -v test_server.py

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name AirRetro `
            --add-data "index.html;." `
            --add-data "assets;assets" `
            server.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\airretro.iss
          Move-Item "dist\AirRetro-Setup-$version.exe" "dist\AirRetro-windows-x86_64-setup.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AirRetro-windows-x86_64-setup.exe
          path: dist/AirRetro-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    if: ${{ always() && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v5
        with:
          name: AirRetro-linux-x86_64
          path: release

      - name: Download Windows installer
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: AirRetro-windows-x86_64-setup.exe
          path: release

      - name: Create checksums
        shell: bash
        run: |
          sha256sum release/AirRetro-* > release/SHA256SUMS.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/AirRetro-* release/SHA256SUMS.txt \
            --title "AirRetro ${{ github.ref_name }}" \
            --generate-notes
