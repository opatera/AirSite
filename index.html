<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AirSite</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      color: #cbd5f5;
    }

    .btn {
      margin-top: 25px;
      display: inline-block;
      padding: 12px 20px;
      background: #38bdf8;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 AirSite is Live</h1>
    <p>Your Linux server is successfully hosting a website using Nginx.</p>
    <p>This site is connected to your GitHub repo and ready to grow.</p>

    <a class="btn" href="#">Next Step →</a>
  </div>
</body>
</html>
